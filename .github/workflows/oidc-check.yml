name: OIDC check

# Answers "can these packages publish without a token?" without spending a version.
#
# The release workflow runs the same script before it publishes anything, so this is not a
# duplicate check — it is the same check, reachable on demand. It exists because the question was
# unanswerable for two releases: publishing is the only thing that exercises the credential, and
# publishing is irreversible, so the honest answer stayed "unknown" while eighteen configured
# trusted publishers went unused.
#
# Publishes nothing. Every npm call is `--dry-run`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Can every package publish over OIDC?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the whole point: without this there is no id_token to exchange
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24 for npm 11.16. Trusted publishing needs npm >= 11.5.1 and Node 22 ships npm 10.9,
      # which is the reason this check had to be written at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Pack every publishable package
        run: >
          pnpm --filter './packages/*' --filter '!@servanda/e2e'
          pack --pack-destination "$RUNNER_TEMP/tarballs"
      # No NODE_AUTH_TOKEN anywhere in this workflow. The script refuses to run if one is set.
      - name: Probe
        run: bash gates/oidc-probe.sh "$RUNNER_TEMP/tarballs" 18
