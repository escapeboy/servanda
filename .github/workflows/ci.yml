name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# "Constitution in code": a PR that breaks a MUST cannot merge. These jobs are that rule.
jobs:
  conformance:
    name: Vector conformance (G0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate G0
        run: bash gates/g0-vectors.sh

  musts:
    name: M-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve through their dist/ entry points, so vitest cannot
      # import them until they are built.
      - run: pnpm -r run build
      - name: Every MUST has a named test
        run: bash gates/must-coverage.sh
      - name: Run the M-suite
        run: npx vitest run --reporter=dot -t 'M-'

  gates:
    name: All gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (topological, via workspace deps)
        run: pnpm -r run build
      - name: Gates
        run: bash gates/run-all.sh

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: npx vitest run --reporter=dot
