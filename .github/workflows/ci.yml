name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# "Constitution in code": a PR that breaks a MUST cannot merge. These jobs are that rule.
jobs:
  conformance:
    name: Vector conformance (G0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate G0
        run: bash gates/g0-vectors.sh

  musts:
    name: M-suite (M-1..M-16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every MUST has a named test
        run: bash gates/must-coverage.sh
      - name: Run the M-suite
        run: npx vitest run --reporter=dot -t 'M-'

  gates:
    name: All gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (topological, via workspace deps)
        run: pnpm -r run build
      - name: Gates
        run: bash gates/run-all.sh

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx vitest run --reporter=dot
