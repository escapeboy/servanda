name: Release

# Publishing happens from CI, not from a laptop, so the provenance attestation npm records
# actually attests to something: a public build of a public commit. A locally published tarball
# would carry the same version number and prove nothing about where it came from.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A tag that disagrees with the manifests would publish a version nobody can find from the
  # release page. Fail before anything reaches the registry, where it cannot be taken back.
  version:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          mismatched=$(node -e "
            const fs = require('fs');
            const bad = fs.readdirSync('packages')
              .map(p => JSON.parse(fs.readFileSync('packages/' + p + '/package.json', 'utf8')))
              .filter(j => j.version !== '$pkg')
              .map(j => j.name + '@' + j.version);
            console.log(bad.join(' '));
          ")
          if [ -n "$mismatched" ]; then
            echo "packages disagree with $pkg: $mismatched" >&2
            exit 1
          fi

  # The gates and the full suite run as SEPARATE jobs, exactly as in ci.yml. The suite is
  # memory-bound — every vault open runs Argon2id at the §9.3 minimum — so running the gate
  # scripts and the full suite back to back on one runner starves the workers and times them
  # out. That failure looks like a broken gate and is not one.
  gates:
    name: All gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Every MUST has a named test
        run: bash gates/must-coverage.sh
      - name: Gates
        run: bash gates/run-all.sh

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: npx vitest run --reporter=dot

  publish:
    name: Publish to npm
    needs: [version, gates, full-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24, not 22, and this job alone. Trusted publishing needs npm >= 11.5.1; Node 22 ships
      # npm 10.9, which has no OIDC support whatsoever. Both v0.1.0-pre and v0.2.0-pre published
      # on the token for that reason, while eighteen configured trusted publishers sat unused and
      # nothing said so — the publish succeeded, provenance was attested, and the log named no
      # credential. Node 24 ships npm 11.16.
      #
      # `package-manager-cache: false` rather than `cache: pnpm`: this job holds `id-token: write`,
      # and setup-node's own guidance is to disable dependency caching in jobs with elevated
      # privileges, where a poisoned cache entry would be restored into a context that can sign.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build

      # The version that made OIDC unreachable was never checked, so its absence looked exactly
      # like its presence. It is checked now, before anything is packed: below 11.5.1 the release
      # stops rather than quietly falling back to the token it is supposed to be retiring.
      - name: npm is new enough for trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version} on node $(node --version)"
          node -e '
            const [have, want] = [process.argv[1], "11.5.1"].map((v) => v.split(".").map(Number));
            const cmp = have[0] - want[0] || have[1] - want[1] || have[2] - want[2];
            if (cmp < 0) {
              console.error(`npm ${process.argv[1]} cannot use trusted publishing; 11.5.1+ is required.`);
              process.exit(1);
            }
          ' "$npm_version"

      # Pack with pnpm, upload with npm — pnpm's own documented split, and here it is load-bearing
      # twice over.
      #
      # Only pnpm rewrites the `workspace:*` every package uses to reach its siblings; an `npm
      # pack` would ship 18 dependency trees no registry can resolve. But only the npm CLI
      # implements the OIDC exchange that trusted publishing needs — pnpm documents no OIDC
      # support at all, and from v11 its publish is native and no longer delegates to npm, so a
      # `pnpm publish` that happens to work today would break on the next pnpm major.
      #
      # `-r` would also pack the workspace root, which is `private: true` and must never reach the
      # registry; filtering to ./packages/* keeps it out by construction rather than by a check
      # after the fact.
      - name: Pack every publishable package
        run: >
          pnpm --filter './packages/*' --filter '!@servanda/e2e'
          pack --pack-destination "$RUNNER_TEMP/tarballs"

      # Both credentials are offered, and that is the migration, not indecision: with npm 11.5.1+
      # the CLI attempts the OIDC exchange first and falls back to the token. A package with a
      # trusted publisher configured is published without any long-lived secret; one that still
      # lacks it publishes on the token instead of failing the release.
      #
      # That fallback is also why the npm-version check above has to exist. On npm 10 there is no
      # exchange to attempt, so every package took the token path and the run looked identical to
      # one that had not: same output, same provenance, same green tick. A silent fallback is only
      # safe when the thing being fallen back FROM is known to have been tried.
      #
      # `NPM_CONFIG_PROVENANCE` stays set even though trusted publishing generates provenance on
      # its own: on the token path nothing would generate it, and a release without an attestation
      # is the one outcome this workflow exists to prevent.
      - name: Publish to npm
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/tarballs/*.tgz)
          if [ ${#tarballs[@]} -ne 18 ]; then
            echo "expected 18 tarballs, found ${#tarballs[@]}" >&2
            printf '%s\n' "${tarballs[@]}" >&2
            exit 1
          fi
          for t in "${tarballs[@]}"; do
            echo "::group::publish $(basename "$t")"
            npm publish "$t" --access public
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
