name: Release

# Publishing happens from CI, not from a laptop, so the provenance attestation npm records
# actually attests to something: a public build of a public commit. A locally published tarball
# would carry the same version number and prove nothing about where it came from.
on:
  push:
    tags: ['v*']
  # Dispatch runs the OIDC probe and PUBLISHES NOTHING.
  #
  # It has to live in this file rather than in a workflow of its own, and that is the lesson of
  # the run that taught it: npm's trusted-publisher configuration names a specific workflow
  # FILENAME, so a probe dispatched from `oidc-check.yml` was refused by all eighteen packages for
  # a reason that had nothing to do with whether the release path works. The credential is scoped
  # to the workflow; the check for it has to run inside the same one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag that disagrees with the manifests would publish a version nobody can find from the
  # release page. Fail before anything reaches the registry, where it cannot be taken back.
  version:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          mismatched=$(node -e "
            const fs = require('fs');
            const bad = fs.readdirSync('packages')
              .map(p => JSON.parse(fs.readFileSync('packages/' + p + '/package.json', 'utf8')))
              .filter(j => j.version !== '$pkg')
              .map(j => j.name + '@' + j.version);
            console.log(bad.join(' '));
          ")
          if [ -n "$mismatched" ]; then
            echo "packages disagree with $pkg: $mismatched" >&2
            exit 1
          fi

  # The gates and the full suite run as SEPARATE jobs, exactly as in ci.yml. The suite is
  # memory-bound — every vault open runs Argon2id at the §9.3 minimum — so running the gate
  # scripts and the full suite back to back on one runner starves the workers and times them
  # out. That failure looks like a broken gate and is not one.
  gates:
    name: All gates
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Every MUST has a named test
        run: bash gates/must-coverage.sh
      - name: Gates
        run: bash gates/run-all.sh

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: npx vitest run --reporter=dot

  publish:
    name: Publish to npm
    needs: [version, gates, full-suite]
    # On a tag: every gate must have passed. On a dispatch: those jobs are skipped by design, so
    # `always()` is what lets this one run at all — and the publish STEP is still gated on the
    # event, so a dispatch can never reach the registry.
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.version.result == 'success' && needs.gates.result == 'success'
       && needs['full-suite'].result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24, not 22, and this job alone. Trusted publishing needs npm >= 11.5.1; Node 22 ships
      # npm 10.9, which has no OIDC support whatsoever. Both v0.1.0-pre and v0.2.0-pre published
      # on the token for that reason, while eighteen configured trusted publishers sat unused and
      # nothing said so — the publish succeeded, provenance was attested, and the log named no
      # credential. Node 24 ships npm 11.16.
      #
      # `package-manager-cache: false` rather than `cache: pnpm`: this job holds `id-token: write`,
      # and setup-node's own guidance is to disable dependency caching in jobs with elevated
      # privileges, where a poisoned cache entry would be restored into a context that can sign.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build

      # Pack with pnpm, upload with npm — pnpm's own documented split, and here it is load-bearing
      # twice over.
      #
      # Only pnpm rewrites the `workspace:*` every package uses to reach its siblings; an `npm
      # pack` would ship 18 dependency trees no registry can resolve. But only the npm CLI
      # implements the OIDC exchange that trusted publishing needs — pnpm documents no OIDC
      # support at all, and from v11 its publish is native and no longer delegates to npm, so a
      # `pnpm publish` that happens to work today would break on the next pnpm major.
      #
      # `-r` would also pack the workspace root, which is `private: true` and must never reach the
      # registry; filtering to ./packages/* keeps it out by construction rather than by a check
      # after the fact.
      - name: Pack every publishable package
        run: >
          pnpm --filter './packages/*' --filter '!@servanda/e2e'
          pack --pack-destination "$RUNNER_TEMP/tarballs"

      # Every package is proved able to publish over OIDC BEFORE any of them is published, and the
      # tarball count is asserted in the same step. See gates/oidc-probe.sh for why a dry run is a
      # real proof and why no token may be present while it runs. On `workflow_dispatch` this is
      # the last step that runs, so the answer costs a workflow run rather than a version.
      - name: Every package can publish over OIDC (no token in this step)
        # EIGHTEEN, and the number is only half of what a new publishable package needs. The
        # other half is an npm trusted-publisher entry, configured in the registry's own settings
        # and not in this repository — `oidc()` takes a package NAME and the trust relationship is
        # per package. `@servanda/ingest` and `@servanda/client-conformance` had neither, which
        # stopped v0.5.0-pre before a single tarball was uploaded: nineteen published and one
        # refused is a release nobody can install and nobody can take back.
        #
        # They are `private: true` for now rather than configured, so this is eighteen again. When
        # a trusted publisher exists for each, drop the flag and raise this to twenty — both, in
        # the same change, because either alone fails the release.
        run: bash gates/oidc-probe.sh "$RUNNER_TEMP/tarballs" 18

      # `--tag latest`, explicitly, and it is not cosmetic. Every version here carries a `-pre`
      # prerelease identifier, and npm 11 REFUSES to publish a prerelease under the default tag:
      # "You must specify a tag using --tag when publishing a prerelease version." npm 10 had no
      # such check, which is why v0.1.0-pre and v0.2.0-pre went out as `latest` without one — the
      # move to npm 11 would have failed the release here otherwise.
      #
      # `latest` rather than `pre` because it is true: every published version is a pre-release,
      # so the newest one IS what `npm install @servanda/node` should give. A `pre` dist-tag would
      # freeze `latest` at whatever shipped last and quietly strand the README's install line.
      #
      # `NPM_CONFIG_PROVENANCE` stays set even though trusted publishing generates provenance on
      # its own: belt and braces on the one outcome this workflow exists to prevent, a release
      # with no attestation.
      - name: Publish to npm
        if: github.event_name == 'push'
        run: |
          shopt -s nullglob
          for t in "$RUNNER_TEMP"/tarballs/*.tgz; do
            echo "::group::publish $(basename "$t")"
            npm publish "$t" --access public --tag latest
            echo "::endgroup::"
          done
        env:
          NPM_CONFIG_PROVENANCE: 'true'
